name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # On prend directement ton dossier 'site' présent dans ton Pycharm
          path: './site' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Afficher le lien du site
        run: |
          echo "### 🎉 Votre suivi de projet IFT3150 est en ligne !" >> $GITHUB_STEP_SUMMARY
          echo "Lien d'accès : ${{ steps.deployment.outputs.page_url }}suivi/" >> $GITHUB_STEP_SUMMARY
