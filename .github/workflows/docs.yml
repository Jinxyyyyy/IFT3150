name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install mkdocs mkdocs-material

      - name: Créer le fichier mkdocs.yml manquant
        run: |
          if [ ! -f mkdocs.yml ]; then
            echo "site_name: Suivi de Projet IFT3150" > mkdocs.yml
            echo "theme:" >> mkdocs.yml
            echo "  name: material" >> mkdocs.yml
            echo "docs_dir: docs" >> mkdocs.yml
            echo "nav:" >> mkdocs.yml
            echo "  - Accueil: index.md" >> mkdocs.yml
            echo "  - Suivi de Projet: suivi.md" >> mkdocs.yml
          fi


      - name: Build Site
        run: mkdocs build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Afficher le lien du site
        run: |
          echo "### 🎉 Votre suivi de projet IFT3150 est en ligne !" >> $GITHUB_STEP_SUMMARY
          echo "Lien d'accès : ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY

